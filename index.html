<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#008080">
  <meta name="description" content="DoyleOS — Jacque's Windows 98-inspired personal link hub by DareToDoyle.">
  <meta property="og:title" content="DoyleOS | DareToDoyle">
  <meta property="og:description" content="Explore Jacque's work, interests and projects through a playful retro desktop.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://daretodoyle.com/">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://daretodoyle.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>DoyleOS | DareToDoyle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section class="login-screen" id="loginScreen" aria-labelledby="loginTitle">
      <div class="screen-label">LOGIN</div>
      <div class="login-window win-window">
        <div class="title-bar"><span>Welcome to DoyleOS</span></div>
        <div class="login-body">
          <div class="brand-row">
            <div class="computer-icon" aria-hidden="true"><span>☺</span></div>
            <div>
              <h1 id="loginTitle">DoyleOS <small>v1.0</small></h1>
              <p>A personal operating system<br>by DareToDoyle.</p>
            </div>
          </div>
          <div class="rule"></div>
          <form id="loginForm" aria-describedby="loginNotice">
            <label>User name: <input id="username" value="" readonly tabindex="-1" autocomplete="off" aria-label="Simulated user name"></label>
            <label>Password: <input id="password" type="password" value="" readonly tabindex="-1" autocomplete="off" aria-label="Simulated password animation"></label>
            <button class="win-button login-button" type="submit"><span class="play">▶</span> OK</button>
          </form>
          <p class="signing" id="signingText" aria-live="polite">Preparing login…</p>
          <p class="sr-only" id="loginNotice">This is a visual introduction only. It does not collect or transmit credentials.</p>
          <div class="login-footer">
            <div class="progress" aria-label="Login progress"><i></i></div>
            <button class="win-button skip-button" id="skipButton" type="button">Skip intro »</button>
          </div>
        </div>
      </div>
    </section>

    <section class="desktop" id="desktop" aria-label="DoyleOS desktop" hidden>
      <div class="desktop-label">DESKTOP</div>
      <div class="icon-grid" id="iconGrid"></div>
      <div class="window-area" id="windowArea"></div>
      <footer class="taskbar">
        <button class="win-button start-button" id="startButton" type="button"><span class="windows-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span> Start</button>
        <div class="task-buttons" id="taskButtons"></div>
        <div class="tray"><span aria-hidden="true">🔊</span><time id="clock"></time></div>
      </footer>
      <div class="start-menu" id="startMenu" hidden>
        <div class="start-rail">DoyleOS</div>
        <div class="start-items" id="startItems"></div>
        <button type="button" id="logoutButton">🔑 Log Out…</button>
      </div>
    </section>
  </main>
  <noscript><div class="noscript">DoyleOS needs JavaScript for its interactive desktop. Please enable JavaScript and reload.</div></noscript>
  <script src="config.js"></script>
  <script src="doyleos.js"></script>
</body>
</html>
